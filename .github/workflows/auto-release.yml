name: Auto Release

# Publishes a GitHub release once the Test workflow has succeeded on master.
#
# The tag is taken from the version in gradle.properties (for example 6.1.0-jp becomes v6.1.0-jp).
# When a release for that version already exists nothing is published, so a new release is made
# by raising the version in gradle.properties and merging that to master.
#
# The jobs are split by privilege: the build runs third-party actions with a read-only token,
# and only the last job, which uses nothing but first-party actions and the gh CLI, can write.

on:
  workflow_run:
    workflows: [ Test ]
    types: [ completed ]
    branches: [ master ]

permissions:
  contents: read

concurrency:
  group: auto-release
  cancel-in-progress: false

env:
  # The commit the tests ran against, which may no longer be the tip of master
  TESTED_SHA: ${{ github.event.workflow_run.head_sha }}

jobs:
  check:
    name: Find the version
    # Only after a push to master whose tests all passed. Pull requests, including those from
    # forks, never get here.
    if: >-
      github.event.workflow_run.conclusion == 'success'
      && github.event.workflow_run.event == 'push'
      && github.event.workflow_run.head_branch == 'master'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      released: ${{ steps.exists.outputs.released }}
    steps:
      - name: Checkout the tested commit
        uses: actions/checkout@v7
        with:
          ref: ${{ env.TESTED_SHA }}
          persist-credentials: false
      - name: Find the version
        id: version
        shell: bash
        run: |
          version="$(sed -nE 's/^version[[:space:]]*=[[:space:]]*([^[:space:]]+).*/\1/p' gradle.properties | tr -d '\r' | head -n 1)"
          if [ -z "$version" ]; then
            echo "::error::No version found in gradle.properties"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
      - name: Check whether the version is already released
        id: exists
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "Release $TAG already exists, nothing to do."
            echo "released=true" >> "$GITHUB_OUTPUT"
          else
            echo "released=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Build the jar
    needs: check
    if: needs.check.outputs.released == 'false'
    runs-on: ubuntu-latest
    # No token that can write: this job runs third-party actions and the project's own build
    permissions:
      contents: read
    steps:
      - name: Checkout the tested commit
        uses: actions/checkout@v7
        with:
          ref: ${{ env.TESTED_SHA }}
          persist-credentials: false
      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: 17
          distribution: liberica
      - name: Build
        uses: burrunan/gradle-cache-action@v3
        with:
          job-id: jdk17
          # The tests have just passed in the Test workflow. -Prelease drops the -SNAPSHOT suffix.
          arguments: --no-parallel --no-daemon -Prelease shadowJar
      - name: Check the jar
        shell: bash
        env:
          VERSION: ${{ needs.check.outputs.version }}
        run: test -f "build/libs/ksar-$VERSION-all.jar" || { echo "::error::ksar-$VERSION-all.jar was not built"; ls build/libs; exit 1; }
      - name: Keep the jar for the release job
        uses: actions/upload-artifact@v7
        with:
          name: jar
          path: build/libs/ksar-${{ needs.check.outputs.version }}-all.jar
          if-no-files-found: error
          retention-days: 1

  release:
    name: Create the release
    needs: [ check, build ]
    runs-on: ubuntu-latest
    permissions:
      # Needed to create the tag and the release
      contents: write
    steps:
      - name: Download the jar
        uses: actions/download-artifact@v8
        with:
          name: jar
          path: dist
      - name: Create the release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.check.outputs.tag }}
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          gh release create "$TAG" "dist/ksar-$VERSION-all.jar" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$TESTED_SHA" \
            --title "$TAG" \
            --generate-notes
